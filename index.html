<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi Kasir & Laporan Harian</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --muted-text: #94a3b8;
            --border-color: #334155;
            --accent-color: #38bdf8;
            --accent-hover: #0ea5e9;
            --danger-color: #f43f5e;
            --success-color: #22c55e;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 15px;
        }

        .container {
            max-width: 650px;
            margin: 0 auto;
            background: var(--card-bg);
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
        }

        h2 {
            text-align: center;
            color: var(--accent-color);
            margin-bottom: 5px;
        }

        .outlet-input {
            margin-bottom: 15px;
            text-align: center;
        }
        .outlet-input input {
            text-align: center;
            font-weight: bold;
            font-size: 1.1rem;
            padding: 8px;
            width: 60%;
            background: #0f172a;
            border: 1px solid var(--border-color);
            color: var(--text-color);
            border-radius: 8px;
        }

        /* Navigasi Tab */
        .tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 10px;
            overflow-x: auto;
        }

        .tab-btn {
            background: #0f172a;
            color: var(--muted-text);
            border: 1px solid var(--border-color);
            padding: 8px 15px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 600;
            white-space: nowrap;
            transition: all 0.2s;
        }

        .tab-btn.active {
            background: var(--accent-color);
            color: #0f172a;
            border-color: var(--accent-color);
        }

        .tab-content { display: none; }
        .tab-content.active { display: block; }

        .form-group { margin-bottom: 15px; }
        label { display: block; font-size: 0.9rem; margin-bottom: 6px; color: var(--muted-text); }
        
        input, select, textarea {
            width: 100%;
            padding: 10px;
            background: #0f172a;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-color);
            box-sizing: border-box;
            font-size: 1rem;
        }

        .btn {
            width: 100%;
            padding: 12px;
            background-color: var(--accent-color);
            color: #0f172a;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.2s;
        }
        .btn:hover { background-color: var(--accent-hover); }
        
        .btn-danger { background-color: var(--danger-color); color: white; }
        .btn-success { background-color: var(--success-color); color: #0f172a; }

        /* Kategori & POS Grid */
        .category-group {
            margin-bottom: 15px;
            background: #131c31;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }
        .category-title {
            font-weight: bold;
            color: var(--accent-color);
            margin-bottom: 8px;
            font-size: 0.95rem;
            border-bottom: 1px dashed var(--border-color);
            padding-bottom: 4px;
        }
        .pos-menu-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
        }
        .pos-item-card {
            background: #0f172a;
            border: 1px solid var(--border-color);
            padding: 10px;
            border-radius: 6px;
            cursor: pointer;
            text-align: center;
            transition: 0.2s;
        }
        .pos-item-card:hover { border-color: var(--accent-color); background: #182238; }
        .pos-item-card h4 { margin: 0 0 3px 0; font-size: 0.95rem; }
        .pos-item-card p { margin: 0; font-size: 0.8rem; color: var(--accent-color); }

        /* Keranjang Transaksi */
        .cart-box {
            background: #0f172a;
            border: 1px solid var(--border-color);
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 15px;
        }
        .cart-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.9rem;
            margin-bottom: 8px;
            border-bottom: 1px dashed var(--border-color);
            padding-bottom: 5px;
        }

        /* Riwayat Transaksi Kasir */
        .history-box {
            background: #0f172a;
            border: 1px solid var(--border-color);
            padding: 12px;
            border-radius: 8px;
            margin-top: 15px;
            max-height: 200px;
            overflow-y: auto;
        }
        .history-item {
            font-size: 0.85rem;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 6px;
            margin-bottom: 6px;
        }

        /* Preview Teks Laporan */
        .preview-container {
            margin-top: 25px;
            background: #0f172a;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }
        pre {
            white-space: pre-wrap;
            word-wrap: break-word;
            font-family: monospace;
            color: #cbd5e1;
            font-size: 0.85rem;
            margin: 0;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Aplikasi Kasir & Laporan</h2>
    <div class="outlet-input">
        <input type="text" id="outlet" value="TAMALATE" oninput="updateAll()">
    </div>

    <!-- Navigasi Tab Utama -->
    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab(event, 'tab-master')">1. Master Menu</button>
        <button class="tab-btn" onclick="switchTab(event, 'tab-kasir')">2. Kasir / Transaksi</button>
        <button class="tab-btn" onclick="switchTab(event, 'tab-keuangan')">3. Keuangan & Modal</button>
        <button class="tab-btn" onclick="switchTab(event, 'tab-laporan')">4. Export Laporan</button>
    </div>

    <!-- TAB 1: MASTER MENU DENGAN KATEGORI -->
    <div id="tab-master" class="tab-content active">
        <h3>Kelola Daftar Menu & Kategori</h3>
        <div class="form-group">
            <label>Kategori Menu (Contoh: Terbul, Martabak Asin, Minuman)</label>
            <input type="text" id="mKategori" placeholder="Contoh: Terbul">
        </div>
        <div class="form-group">
            <label>Nama Menu</label>
            <input type="text" id="mNama" placeholder="Contoh: Terbul Coklat">
        </div>
        <div class="form-group">
            <label>Harga Satuan (Rp)</label>
            <input type="number" id="mHarga" placeholder="Contoh: 15000">
        </div>
        <button class="btn" onclick="tambahMasterMenu()">Simpan Menu Baru</button>

        <div style="margin-top: 20px;">
            <label>Daftar Menu Berdasarkan Kategori:</label>
            <div id="listMasterMenu"></div>
        </div>
    </div>

    <!-- TAB 2: KASIR / TRANSAKSI HARIAN -->
    <div id="tab-kasir" class="tab-content">
        <h3>Input Transaksi Penjualan Harian</h3>
        <div class="form-group">
            <label>Pilih Saluran Pembayaran</label>
            <select id="metodeBayar">
                <option value="cash">Cash (Tunai)</option>
                <option value="qris">QRIS</option>
                <option value="grab">Grab</option>
                <option value="shopee">Shopee</option>
                <option value="gofood">Gofood</option>
            </select>
        </div>

        <label>Pilih Menu:</label>
        <div id="posMenuContainer" style="max-height: 250px; overflow-y: auto; margin-bottom: 15px;">
            <!-- Muncul otomatis dikelompokkan berdasarkan kategori -->
        </div>

        <div class="cart-box">
            <label style="font-weight: bold; margin-bottom: 5px;">Keranjang Transaksi Ini:</label>
            <div id="cartItems"><span style="color:var(--muted-text); font-size:0.85rem;">Belum ada item dipilih.</span></div>
            <div style="font-weight: bold; margin-top: 8px; text-align: right;" id="cartTotal">Total Transaksi: Rp 0</div>
        </div>
        <button class="btn btn-success" onclick="simpanTransaksi()">Catat & Masukkan Transaksi</button>
        
        <!-- PANEL RIWAYAT INPUT KASIR (SOLUSI MASALAH 1) -->
        <div class="history-box">
            <label style="font-weight: bold; color: var(--accent-color); margin-bottom: 5px;">Riwayat Input Kasir Hari Ini:</label>
            <div id="listRiwayatKasir"><span style="color:var(--muted-text); font-size:0.85rem;">Belum ada transaksi diinput.</span></div>
        </div>
    </div>

    <!-- TAB 3: KEUANGAN & MODAL -->
    <div id="tab-keuangan" class="tab-content">
        <h3>Keuangan & Modal Harian</h3>
        <div class="form-group">
            <label>Tanggal Laporan</label>
            <input type="date" id="tanggal" onchange="updateAll()">
        </div>
        <div class="form-group">
            <label>Open Uang Outlet (Modal / Uang Kecil)</label>
            <input type="number" id="openUang" value="313000" oninput="updateAll()">
        </div>
        <div class="form-group">
            <label>Total Belanja / Pengeluaran (Rp)</label>
            <input type="number" id="pengeluaranTotal" value="20000" oninput="updateAll()">
        </div>
        <div class="form-group">
            <label>Rincian Pengeluaran</label>
            <textarea id="pengeluaranDetail" oninput="updateAll()">• 20.000 ( K Coa)</textarea>
        </div>
    </div>

    <!-- TAB 4: EXPORT LAPORAN -->
    <div id="tab-laporan" class="tab-content">
        <h3>Export Laporan Akumulasi Harian</h3>
        <div class="preview-container">
            <label style="font-weight: bold; margin-bottom: 8px; color: var(--accent-color);">Format Chat Laporan Akhir:</label>
            <pre id="previewText">Memuat laporan...</pre>
            <button class="btn" style="margin-top: 15px;" onclick="copyText()">Salin Teks Laporan Chat</button>
            <button class="btn btn-success" style="margin-top: 8px;" onclick="downloadTxt()">Download File .TXT</button>
        </div>
    </div>
</div>

<script>
    document.getElementById('tanggal').valueAsDate = new Date();

    // 1. Data Master Menu dengan Kategori
    let masterMenu = [
        { id: 1, kategori: "Terbul", nama: "Terbul Coklat", harga: 15000 },
        { id: 2, kategori: "Terbul", nama: "Terbul Keju", harga: 18000 },
        { id: 3, kategori: "Terbul", nama: "Terbul CocoCrancy", harga: 20000 },
        { id: 4, kategori: "Martabak", nama: "Martabak Istimewa", harga: 35000 },
        { id: 5, kategori: "Paket", nama: "Paket 1", harga: 25000 }
    ];

    // 2. Data Akumulasi Penjualan Harian per Channel
    let dataPenjualan = {
        grab: { total: 0, rincian: [] },
        shopee: { total: 0, rincian: [] },
        gofood: { total: 0, rincian: [] },
        cash: { total: 36000, rincian: ["• Terbul Coklat (1)", "• Terbul Keju (1)"] },
        qris: { total: 113000, rincian: ["• Martabak Istimewa (1)", "• Terbul CocoCrancy (1)", "• Terbul Keju (1)", "• Paket 1 (1)"] }
    };

    // Log riwayat transaksi lokal kasir hari ini
    let riwayatTransaksiLog = [
        { metode: "Cash", rincian: "Terbul Coklat (1), Terbul Keju (1)", total: 36000 },
        { metode: "Qris", rincian: "Martabak Istimewa (1), Terbul CocoCrancy (1), Terbul Keju (1), Paket 1 (1)", total: 113000 }
    ];

    let activeCart = [];

    function switchTab(evt, tabId) {
        let contents = document.getElementsByClassName("tab-content");
        for (let c of contents) c.classList.remove("active");
        let buttons = document.getElementsByClassName("tab-btn");
        for (let b of buttons) b.classList.remove("active");

        document.getElementById(tabId).classList.add("active");
        evt.currentTarget.classList.add("active");
        updateAll();
    }

    function formatRupiah(angka) {
        return new Intl.NumberFormat('id-ID').format(angka);
    }

    function formatTanggalIndo(dateString) {
        if (!dateString) return '';
        const parts = dateString.split('-');
        const namaBulan = ["Jan", "Feb", "Mar", "Apr", "Mei", "Jun", "Jul", "Agt", "Sep", "Okt", "Nov", "Des"];
        return `${parseInt(parts[2], 10)} ${namaBulan[parseInt(parts[1], 10) - 1]} ${parts[0]}`;
    }

    // Master Menu Functions
    function tambahMasterMenu() {
        const kategori = document.getElementById('mKategori').value.trim() || "Umum";
        const nama = document.getElementById('mNama').value.trim();
        const harga = parseFloat(document.getElementById('mHarga').value) || 0;
        if (!nama || harga <= 0) { alert('Nama dan harga harus diisi dengan benar!'); return; }
        
        masterMenu.push({ id: Date.now(), kategori, nama, harga });
        document.getElementById('mKategori').value = '';
        document.getElementById('mNama').value = '';
        document.getElementById('mHarga').value = '';
        renderMasterMenu();
        renderPOSGrid();
    }

    function hapusMasterMenu(id) {
        masterMenu = masterMenu.filter(m => m.id !== id);
        renderMasterMenu();
        renderPOSGrid();
    }

    function renderMasterMenu() {
        let container = document.getElementById('listMasterMenu');
        container.innerHTML = '';
        
        // Kelompokkan berdasarkan kategori
        let grouped = {};
        masterMenu.forEach(m => {
            if (!grouped[m.kategori]) grouped[m.kategori] = [];
            grouped[m.kategori].push(m);
        });

        for (let kat in grouped) {
            let htmlItems = '';
            grouped[kat].forEach(m => {
                htmlItems += `
                    <div style="background:#0f172a; border:1px solid var(--border-color); padding:8px; border-radius:6px; margin-bottom:6px; display:flex; justify-content:space-between; align-items:center;">
                        <div><b>${m.nama}</b><br><span style="font-size:0.8rem; color:var(--accent-color);">Rp ${formatRupiah(m.harga)}</span></div>
                        <button class="btn btn-danger" style="width:auto; padding:4px 8px; margin:0; font-size:0.8rem;" onclick="hapusMasterMenu(${m.id})">Hapus</button>
                    </div>
                `;
            });
            container.innerHTML += `
                <div class="category-group">
                    <div class="category-title">📂 ${kat}</div>
                    ${htmlItems}
                </div>
            `;
        }
    }

    // POS & Cart Functions Berdasarkan Kategori
    function renderPOSGrid() {
        let container = document.getElementById('posMenuContainer');
        container.innerHTML = '';

        let grouped = {};
        masterMenu.forEach(m => {
            if (!grouped[m.kategori]) grouped[m.kategori] = [];
            grouped[m.kategori].push(m);
        });

        for (let kat in grouped) {
            let gridCards = '';
            grouped[kat].forEach(m => {
                gridCards += `
                    <div class="pos-item-card" onclick="addToCart(${m.id})">
                        <h4>${m.nama}</h4>
                        <p>Rp ${formatRupiah(m.harga)}</p>
                    </div>
                `;
            });
            container.innerHTML += `
                <div class="category-group">
                    <div class="category-title">📂 ${kat}</div>
                    <div class="pos-menu-grid">
                        ${gridCards}
                    </div>
                </div>
            `;
        }
    }

    function addToCart(id) {
        let item = masterMenu.find(m => m.id === id);
        let exist = activeCart.find(c => c.id === id);
        if (exist) { exist.qty += 1; } 
        else { activeCart.push({ id: item.id, nama: item.nama, harga: item.harga, qty: 1 }); }
        renderCart();
    }

    function renderCart() {
        let container = document.getElementById('cartItems');
        let total = 0;
        container.innerHTML = '';
        if (activeCart.length === 0) {
            container.innerHTML = '<span style="color:var(--muted-text); font-size:0.85rem;">Belum ada item dipilih.</span>';
            document.getElementById('cartTotal').innerText = 'Total Transaksi: Rp 0';
            return;
        }
        activeCart.forEach((c, idx) => {
            let sub = c.harga * c.qty;
            total += sub;
            container.innerHTML += `
                <div class="cart-row">
                    <span>${c.nama} (${c.qty}x)</span>
                    <span>Rp ${formatRupiah(sub)} <button onclick="activeCart.splice(${idx},1);renderCart();" style="background:none; border:none; color:var(--danger-color); cursor:pointer; font-weight:bold;">✕</button></span>
                </div>
            `;
        });
        document.getElementById('cartTotal').innerText = `Total Transaksi: Rp ${formatRupiah(total)}`;
    }

    function simpanTransaksi() {
        if (activeCart.length === 0) { alert('Keranjang masih kosong!'); return; }
        let metodeSelect = document.getElementById('metodeBayar');
        let metodeKey = metodeSelect.value;
        let metodeText = metodeSelect.options[metodeSelect.selectedIndex].text;
        
        let totalTransaksi = activeCart.reduce((sum, item) => sum + (item.harga * item.qty), 0);
        let itemRincianArr = activeCart.map(item => `${item.nama} (${item.qty})`);

        // Masukkan ke data akumulasi laporan
        dataPenjualan[metodeKey].total += totalTransaksi;
        itemRincianArr.forEach(r => {
            dataPenjualan[metodeKey].rincian.push(`• ${r}`);
        });

        // Masukkan ke log riwayat kasir lokal
        riwayatTransaksiLog.push({
            metode: metodeText,
            rincian: itemRincianArr.join(', '),
            total: totalTransaksi
        });

        activeCart = [];
        renderCart();
        renderRiwayatKasir();
        alert('Transaksi berhasil dicatat!');
        updateAll();
    }

    function renderRiwayatKasir() {
        let container = document.getElementById('listRiwayatKasir');
        if (riwayatTransaksiLog.length === 0) {
            container.innerHTML = '<span style="color:var(--muted-text); font-size:0.85rem;">Belum ada transaksi diinput.</span>';
            return;
        }
        container.innerHTML = '';
        riwayatTransaksiLog.slice().reverse().forEach(log => {
            container.innerHTML += `
                <div class="history-item">
                    <b>[${log.metode}]</b> - Rp ${formatRupiah(log.total)}<br>
                    <span style="color: var(--muted-text);">${log.rincian}</span>
                </div>
            `;
        });
    }

    // Generate Format Text Laporan Chat
    function generateReportString() {
        const outlet = document.getElementById('outlet').value.toUpperCase();
        const formattedDate = formatTanggalIndo(document.getElementById('tanggal').value);

        const grabTot = formatRupiah(dataPenjualan.grab.total);
        const shopeeTot = formatRupiah(dataPenjualan.shopee.total);
        const gofoodTot = formatRupiah(dataPenjualan.gofood.total);
        const cashTot = formatRupiah(dataPenjualan.cash.total);
        const qrisTot = formatRupiah(dataPenjualan.qris.total);

        const totalSemuaPenjualan = dataPenjualan.grab.total + dataPenjualan.shopee.total + dataPenjualan.gofood.total + dataPenjualan.cash.total + dataPenjualan.qris.total;
        
        const openUang = parseFloat(document.getElementById('openUang').value) || 0;
        const pengeluaranTotal = parseFloat(document.getElementById('pengeluaranTotal').value) || 0;
        const pengeluaranDetail = document.getElementById('pengeluaranDetail').value;
        const closeUang = (totalSemuaPenjualan + openUang) - pengeluaranTotal;

        let cashDetStr = dataPenjualan.cash.rincian.join('\n');
        let qrisDetStr = dataPenjualan.qris.rincian.join('\n');

        let text = `${outlet} ${formattedDate}\n` +
                   `ONLINE\n` +
                   `Grab : ${grabTot}\n-\n` +
                   `Shopee : ${shopeeTot}\n• \n` +
                   `Gofood: ${gofoodTot}\n-\n\n` +
                   `OFFLINE\n` +
                   `Cash: ${cashTot}\n${cashDetStr}\n` +
                   `Qris: ${qrisTot}\n${qrisDetStr}\n` +
                   `TOTAL Penjualan : ${formatRupiah(totalSemuaPenjualan)}\n\n` +
                   `Open Uang Outlet : ${formatRupiah(openUang)}\n` +
                   `Pengeluaran : ${formatRupiah(pengeluaranTotal)}\n${pengeluaranDetail}\n` +
                   `Close Uang Outlet : ${formatRupiah(closeUang)}`;

        return text;
    }

    function updateAll() {
        document.getElementById('previewText').innerText = generateReportString();
    }

    function copyText() {
        navigator.clipboard.writeText(generateReportString()).then(() => {
            alert('Teks laporan berhasil disalin ke clipboard!');
        });
    }

    function downloadTxt() {
        const blob = new Blob([generateReportString()], { type: 'text/plain;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `Laporan_${document.getElementById('outlet').value}_${document.getElementById('tanggal').value}.txt`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
    }

    // Inisialisasi awal
    renderMasterMenu();
    renderPOSGrid();
    renderRiwayatKasir();
    updateAll();
</script>

</body>
</html>
